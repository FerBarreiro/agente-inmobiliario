services:
  - type: web
    # La producción se promueve únicamente desde main. La instancia existente
    # conserva de momento su nombre/URL histórica para no interrumpir accesos.
    name: agente-inmobiliario-dev
    branch: main
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
